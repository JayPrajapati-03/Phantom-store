<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0f" />
    <meta
      name="description"
      content="Phantom Store - Browser-native AR try-on commerce. Shop products with 3D previews, AI style support, and camera-based try-on experiences."
    />
    <script>
      (() => {
        const noisePatterns = [
          "download the react devtools for a better development experience",
          "refused to get unsafe header \"x-rtb-fingerprint-id\"",
          "refused to get unsafe header \"request-id\"",
          "\"serviceworker\" must be a dictionary in your web app manifest",
          "serviceworker must be a dictionary in your web app manifest",
          "permissions policy violation: accelerometer is not allowed in this document",
          "the devicemotion events are blocked by permissions policy",
          "the deviceorientation events are blocked by permissions policy",
          "net::err_connection_refused"
        ];
        const noiseSources = [
          "checkout-static-next.razorpay.com",
          "api.razorpay.com",
          "api.sardine.ai",
          "browser.sentry-cdn.com",
          "localhost:7070",
          "localhost:37857"
        ];
        const blockedHeaders = new Set(["x-rtb-fingerprint-id", "request-id"]);
        const frameAllow = [
          "accelerometer",
          "gyroscope",
          "magnetometer",
          "payment",
          "clipboard-read",
          "clipboard-write",
          "publickey-credentials-get"
        ].join("; ");

        const isNoise = (args) => {
          const text = args.map((arg) => {
            if (typeof arg === "string") return arg;
            if (arg instanceof Error) return `${arg.name}: ${arg.message}`;
            try {
              return JSON.stringify(arg);
            } catch {
              return String(arg);
            }
          }).join(" ").toLowerCase();

          return noisePatterns.some((pattern) => text.includes(pattern))
            || noiseSources.some((source) => text.includes(source));
        };

        ["log", "info", "debug", "warn", "error"].forEach((method) => {
          const original = console[method];
          console[method] = (...args) => {
            if (isNoise(args)) return;
            original(...args);
          };
        });

        window.addEventListener("error", (event) => {
          if (isNoise([event.message, event.filename, event.target?.src, event.target?.href].filter(Boolean))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener("unhandledrejection", (event) => {
          if (isNoise([event.reason?.message, event.reason].filter(Boolean))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        const originalGetResponseHeader = XMLHttpRequest.prototype.getResponseHeader;

        XMLHttpRequest.prototype.getResponseHeader = function (name) {
          if (blockedHeaders.has(String(name).toLowerCase())) return null;
          return originalGetResponseHeader.call(this, name);
        };

        const applyFramePolicy = (frame) => {
          if (frame?.tagName !== "IFRAME") return;
          const existingAllow = frame.getAttribute("allow");
          frame.setAttribute("allow", existingAllow ? `${existingAllow}; ${frameAllow}` : frameAllow);
        };

        const originalCreateElement = Document.prototype.createElement;
        Document.prototype.createElement = function (tagName, options) {
          const element = originalCreateElement.call(this, tagName, options);
          if (String(tagName).toLowerCase() === "iframe") applyFramePolicy(element);
          return element;
        };

        new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              applyFramePolicy(node);
              node.querySelectorAll?.("iframe").forEach(applyFramePolicy);
            });
          });
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <link rel="manifest" href="/app.webmanifest?v=20260511c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Phantom Store - AR Try-On Commerce</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
